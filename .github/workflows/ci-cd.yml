name: CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/sanad005/app-backend
  PROJECT_DIR: /home/aau/Desktop/project2/app

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend image
        run: docker build -t $IMAGE_NAME:latest -f backend/dockerfile .

      - name: Push image to GHCR
        run: docker push $IMAGE_NAME:latest

      - name: Sync vault script to compose project
        run: cp vault-script.sh "$PROJECT_DIR/vault-script.sh"

      - name: Fetch secrets from Vault
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x vault-script.sh
          ./vault-script.sh

      - name: Pull latest image and restart containers
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose pull
          docker compose down
          docker compose up -d

      - name: Wait for backend to start
        working-directory: ${{ env.PROJECT_DIR }}
        run: sleep 15

      # ✅ FIXED - Check container logs instead of curl
      - name: Check backend is responding
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Check if backend container is running
          if ! docker compose ps backend | grep -q "Up"; then
            echo "Backend container is not running!"
            docker compose logs backend
            exit 1
          fi
          
          # Check for errors in logs
          if docker compose logs backend | grep -i "error\|traceback"; then
            echo "Backend has errors!"
            docker compose logs backend --tail=50
            exit 1
          fi
          
          echo "Backend is running successfully!"