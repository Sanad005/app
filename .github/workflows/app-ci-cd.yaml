name: App CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f docker-compose.yaml build

      - name: Run stack (app + postgres)
        run: |
          export VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}
          docker compose -f docker-compose.yaml up -d

      - name: Wait for backend to be healthy
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:5000/health && break
            sleep 2
          done

      - name: Run tests
        run: docker compose -f docker-compose.yaml exec -T backend pytest

      - name: Tear down (optional, if you don't want it left running)
        if: always()
        run: docker compose -f docker-compose.yaml down